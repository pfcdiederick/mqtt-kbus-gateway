# mosquitto on the WAGO PFC, for kbus-gateway, the mqtt-bridge and the mqtt-manager.
# Built into the image kbus-mosquitto (docker/mosquitto/Dockerfile).
# Change it here and deploy again: tools/deploy-docker.sh <pfc-ip>

# Retained values (the last value of every KBUS channel) survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Every listener has its own access rules.
per_listener_settings true

# 1) MQTT for everyone on the network and on the controller, WITHOUT login.
#    Everyone who can reach port 1883 can read all I/O and switch the outputs.
#    With login instead: allow_anonymous false + password_file (see the end of this file).
listener 1883
allow_anonymous true

# 2) MQTT over WebSocket for the monitor page of the mqtt-manager (https://<pfc>/mqtt/;
#    the WAGO web server forwards /mqtt/ws to this listener). Only reachable from the
#    controller itself; read everything, write only the bus settings and the outputs of
#    kbus-gateway (acl-monitor; the page writes outputs only in its control mode).
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/acl-monitor

# Login for listener 1 (instead of allow_anonymous true):
#   allow_anonymous false
#   password_file /mosquitto/config/passwd     (mosquitto_passwd -c <file> <user>)
#   acl_file /mosquitto/config/acl             (who may write kbus/do/+/set ...)
# Add the files to this folder and to the Dockerfile.
