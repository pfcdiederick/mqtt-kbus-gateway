; ---------------------------------------------------------------------------
; mqtt-bridge: what is bridged from other MQTT brokers to the broker on this PFC
; ---------------------------------------------------------------------------
; File on the controller: /home/mqtt-bridge/mqtt-bridge.ini
; After a change:         docker restart mqtt-bridge
; Comments start with ;   (# is an MQTT wildcard)
;
; One section per broker you want to read from:
;
;   [remote <name>]
;   host   = <IP address or host name>
;   port   = 1883
;   topics =
;       <topic on that broker> -> <where it goes on this PFC>
;
; Topic lines:
;   sensors/#          -> plant      sensors/hall/temp  arrives as  plant/sensors/hall/temp
;   sensors/hall/temp  -> hall/temp  one topic, renamed: arrives as hall/temp
;   sensors/#                        same topic name as on the other broker
;
; More settings per broker (all optional):
;   username, password    login on that broker
;   tls = true            encrypted (port 8883); ca_file / cert_file / key_file in /home/mqtt-bridge/
;   qos = 0|1|2           default 1
;   retain = always|keep|never      default always: the last value stays available on this PFC
;   strip_prefix = site1/           remove this from the front of the topic first
;   protocol = 3.1.1|5, transport = tcp|websockets, client_id, keepalive, insecure = true
;
; Messages mapped into kbus/... can switch outputs (kbus/do/1/set): only on purpose,
; and then with retain = never.
; ---------------------------------------------------------------------------

; Example (remove the ; at the start of the lines to use it):
; [remote plant]
; host = 192.168.178.50
; port = 1883
; topics =
;     factory/line1/#    -> plant
;     weather/outside    -> weather/outside


; The broker on this PFC (normally nothing to change)
[local]
host = 127.0.0.1
port = 1883

[general]
log_level = INFO          ; DEBUG shows every forwarded message
status_topic = bridge     ; bridge/status, bridge/<name>/status = online | offline
stats_s = 300             ; message counters in the log every N seconds (0 = off)
