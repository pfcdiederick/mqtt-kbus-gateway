# kbus-gateway settings (native installation).
# Read by /etc/init.d/kbus-gateway; apply changes with:
#   /etc/init.d/kbus-gateway restart
# All variables: docs/MANUAL.md section 8. This file is kept on package updates.

# MQTT broker: mosquitto on this controller
MQTT_HOST=127.0.0.1
MQTT_PORT=1883
MQTT_USERNAME=          # empty = anonymous
MQTT_PASSWORD=
#MQTT_CLIENT_ID=        # default kbus-gateway-<hostname>
MQTT_KEEPALIVE_S=30

# Topics: <prefix>/di/1, <prefix>/do/1/set ... (docs/MANUAL.md section 3)
MQTT_TOPIC_PREFIX=kbus  # e.g. plant1/pfc300-01/kbus when several controllers share a broker
MQTT_RETAIN=1           # 1 = values are retained (a new subscriber gets them at once)
MQTT_PUBLISH_MS=20      # look for changes every N ms (5..10000)
MQTT_ANALOG_DEADBAND=0  # AI/AO: publish when the raw value changed by at least N (0 = every change)
MQTT_ARRAYS=1           # also <prefix>/<class>/all as JSON array
MQTT_STATS_S=10         # <prefix>/bus/statistics every N s (0 = off)
MQTT_REPUBLISH_S=0      # publish everything again every N s (0 = only changes)
MQTT_WRITE_ENABLE=1     # 0 = read only: no .../set topics are subscribed
MQTT_LOG=1              # 0 none, 1 writes that change an output, 2 every received message (testing only)
MQTT_PRIORITY=30        # SCHED_FIFO priority of the MQTT thread (below KBUS_PRIORITY), 0 = normal
MQTT_RAW_MIN_MS=100     # <prefix>/module/<pos>/in at most once per N ms per module (latest bytes always follow); 0 = every change
MQTT_AI_STATUS_MS=1000  # <prefix>/ai/<n>/status: register 6 of each AI channel at most once per N ms (min 1000); 0 = off
MQTT_WATCHDOG_S=0       # no write and no <prefix>/watchdog/set for N s -> all outputs 0 (safe state); 0 = off
#MODULE_450_RESOLUTION=0.1   # 750-450: value per digit (Pt100: 0.1 degC)
#MODULE_450_UNIT=°C

# KBUS cycle
KBUS_CYCLE_MS=5         # 1..40 ms; check <prefix>/bus/statistics after a change.
                        # A value written to <prefix>/bus/cycletime/set is kept in KBUS_SETTINGS_STORE and wins.
#KBUS_SETTINGS_STORE=/home/kbus-gateway/kbus-settings.conf   # "" = do not store it
KBUS_PRIORITY=40        # SCHED_FIFO real-time priority of the KBUS cycle, 0 = off

# Serial interface COM1: forwarded transparently on <prefix>/serial/com1/... (WBM: serial owner "None")
#SERIAL_DEVICE=/dev/serial   # "" = COM1 off (no serial topics)
#SERIAL_BAUD=19200           # 1200 2400 4800 9600 19200 38400 57600 115200 230400
#SERIAL_FORMAT=8E1           # data bits 5..8, parity N/E/O, stop bits 1/2
#SERIAL_FRAME_GAP_MS=10      # 1..1000: a pause this long ends a received frame
                             # Values written to <prefix>/serial/com1/.../set are kept in KBUS_SETTINGS_STORE and win.

# Logging: syslog (/var/log/messages, ident kbus-gateway)
LOG_TARGET=syslog
